name: Build OrbbecSDK + nvblox Docker Image

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docker/**'
      - 'sdk_install.sh'
      - 'src/**'
      - 'CMakeLists.txt'

env:
  ORBBEC_SDK_URL: "https://github.com/orbbec/OrbbecSDK/releases/download/v1.10.16/OrbbecSDK_C_C++_v1.10.16_20241021_5113dad_linux_x64_release.zip"
  DOCKER_IMAGE: "orbbec-nvblox-cuda12.4"
  NVBLOX_VERSION: "1.3.0"

jobs:
  build-docker:
    runs-on: ubuntu-22.04-cuda12.4
    strategy:
      matrix:
        # 支持Pascal全架构（60/61/62）及虚拟架构
        cuda_arch: ["60", "61", "62", "60-real"]
    timeout-minutes: 45

    steps:
    - name: Checkout code with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # NVIDIA容器运行时配置
    - name: Configure NVIDIA Container Toolkit
      run: |
        sudo tee /etc/docker/daemon.json <<EOF
        {
            "runtimes": {
                "nvidia": {
                    "path": "/usr/bin/nvidia-container-runtime",
                    "runtimeArgs": []
                }
            },
            "default-runtime": "nvidia"
        }
        EOF
        sudo systemctl restart docker

    # 构建Docker镜像
    - name: Build combined Docker image
      run: |
        # 处理架构参数
        BUILD_ARCH="${{ matrix.cuda_arch }}"
        TAG_SUFFIX="v${NVBLOX_VERSION}-sdk1.10.16-arch$BUILD_ARCH"

        docker build \
          --build-arg ORBBEC_SDK_URL=${{ env.ORBBEC_SDK_URL }} \
          --build-arg CUDA_ARCH=$BUILD_ARCH \
          -t ${{ env.DOCKER_IMAGE }}:$TAG_SUFFIX \
          -f docker/Dockerfile.combined .

    # 双重验证
    - name: Verify installations
      run: |
        TAG_SUFFIX="v${{ env.NVBLOX_VERSION }}-sdk1.10.16-arch${{ matrix.cuda_arch }}"
        
        # 验证Orbbec SDK
        docker run --rm ${{ env.DOCKER_IMAGE }}:$TAG_SUFFIX \
          bash -c "[ -f /usr/local/orbbec/version.txt ] && grep -q '1.10.16' /usr/local/orbbec/version.txt"

        # 验证nvblox二进制
        docker run --rm ${{ env.DOCKER_IMAGE }}:$TAG_SUFFIX \
          bash -c "cuobjdump -lelf /usr/local/bin/nvblox_example | grep -q 'sm_${{ matrix.cuda_arch }}'"

    # 保存并上传镜像为构件
    - name: Save and Upload Docker Image
      if: success()
      run: |
        TAG_SUFFIX="v${{ env.NVBLOX_VERSION }}-sdk1.10.16-arch${{ matrix.cuda_arch }}"
        IMAGE_FILENAME="${{ env.DOCKER_IMAGE }}_$TAG_SUFFIX.tar"
        
        # 保存镜像为tar文件
        docker save -o $IMAGE_FILENAME ${{ env.DOCKER_IMAGE }}:$TAG_SUFFIX
        
        # 压缩镜像文件（可选）
        gzip $IMAGE_FILENAME

        # 上传构件到Actions
        echo "Download link will be available in Artifacts section after build"
        echo "Use: docker load < ${IMAGE_FILENAME}.gz"
        mv $IMAGE_FILENAME.gz artifact-${TAG_SUFFIX}.tar.gz
        act release-artifact artifact-${TAG_SUFFIX}.tar.gz
